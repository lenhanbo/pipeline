seed: 123456
device: cuda

data:
  root: ../data/iam_dataset
  train_gt: train_gt.txt
  val_gt: val_gt.txt
  # A two-patch merger task is undefined for one-character transcripts.
  min_text_length: 2
  max_train_samples: null
  max_val_samples: null

corruption:
  # One generated character is a square 32x32 patch. The merger sees the last
  # prefix character plus the newly generated character: 2 * 32 = 64 px.
  patch_width: 32
  window_width: 64
  image_height: 32
  center_gap_width: 2
  # Sample 64px windows from a truncated normal distribution around the word
  # center, retrying until both 32px halves contain visible handwriting.
  window_center_std_fraction: 0.18
  window_sample_attempts: 16
  record_sample_attempts: 8
  min_half_ink_pixels: 8
  # Optionally whiten a full-height strip at the left edge of the right patch
  # before centering and geometry. Width 2 means columns 0 and 1 are removed.
  boundary_erase_probability: 0.60
  boundary_erase_width: 2
  rotation_degrees: 8.0
  translate_x: 6
  translate_y: 4
  shear_degrees: 8.0
  scale_min: 0.90
  scale_max: 1.10
  geometry_identity_probability: 0.20
  # No blur, contrast jitter, or morphology in the first baseline. Add only
  # mild Gaussian noise on ink pixels so the white paper stays unchanged.
  noise_probability: 0.30
  noise_std_min: 0.005
  noise_std_max: 0.025
  # Simulate an independently generated character centered in its own patch.
  # These margins leave room for the right patch to move visibly after affine.
  standalone_margin_x: 6
  standalone_margin_y: 4

model:
  image_height: 32
  patch_width: 32
  window_width: 64
  vit_patch_size: 4
  embed_dim: 256
  transformer_layers: 6
  transformer_heads: 8
  transformer_ffn_dim: 1024
  prefix_transformer_layers: 2
  dropout: 0.10

loss:
  mse_weight: 1.0
  left_identity_weight: 0.50

training:
  # Keep 32x32-character checkpoints separate from the incompatible 32x16 run.
  output_dir: runs/merger_e2e
  # The 32x64 ViT input is small; a larger physical batch keeps a T4 busy.
  # One optimizer update now needs one forward/backward pass instead of two.
  batch_size: 12
  gradient_accumulation: 1
  num_workers: 4
  amp: true
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 100
  gradient_clip: 1.0
  log_every: 20
  eval_every: 500
  validation_batches: 50
  # One end-to-end schedule; join repair is an augmentation, not a second stage.
  merge:
    max_steps: 20000

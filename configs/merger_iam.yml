seed: 123456
device: cuda

data:
  root: ../data/iam_dataset
  train_gt: train_gt.txt
  val_gt: val_gt.txt
  max_train_samples: null
  max_val_samples: null

corruption:
  # VATr generates 16 px of width per character. Merger sees exactly the last
  # prefix patch plus the newly generated patch: 2 * 16 = 32 px.
  patch_width: 16
  window_width: 32
  image_height: 32
  edit_width: 16
  center_gap_width: 2
  min_side_width: 16
  # Continuation pretraining keeps all pixels visible. It learns to undo only
  # small geometric misalignment and image noise.
  continuation_rotation_degrees: 3.0
  continuation_translate_x: 3
  continuation_translate_y: 2
  continuation_shear_degrees: 2.0
  continuation_scale_min: 0.97
  continuation_scale_max: 1.03
  continuation_geometry_probability: 0.90
  continuation_noise_probability: 0.80
  continuation_noise_std_min: 0.005
  continuation_noise_std_max: 0.04
  continuation_blur_probability: 0.25
  # No random occlusion; seam still removes only the requested center line.
  mask_probability: 0.0
  rotation_degrees: 8.0
  translate_x: 6
  translate_y: 4
  shear_degrees: 8.0
  scale_min: 0.90
  scale_max: 1.10
  geometry_identity_probability: 0.20

model:
  image_height: 32
  patch_width: 16
  window_width: 32
  vit_patch_size: 4
  embed_dim: 256
  transformer_layers: 6
  transformer_heads: 8
  transformer_ffn_dim: 1024
  prefix_transformer_layers: 2
  dropout: 0.10
  # A full black-to-white or white-to-black correction spans 2.0 in [-1, 1].
  residual_scale: 2.0

loss:
  l1_weight: 1.0
  left_identity_weight: 0.50

training:
  output_dir: runs/merger_iam
  # The 32x32 ViT input is small; a larger physical batch keeps a T4 busy.
  # One optimizer update now needs one forward/backward pass instead of two.
  batch_size: 12
  gradient_accumulation: 1
  num_workers: 4
  amp: true
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 100
  gradient_clip: 1.0
  log_every: 20
  eval_every: 500
  validation_batches: 50
  continuation:
    max_steps: 20000
  seam:
    max_steps: 10000
